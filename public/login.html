<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GrandVista | Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;

            background:
                linear-gradient(rgba(4,17,34,.82), rgba(4,17,34,.9)),
                url("https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=1800&q=85")
                center/cover;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 420px;
            padding: 50px 40px;

            background: rgba(10,27,48,.88);
            border: 1px solid rgba(212,175,55,.45);
            box-shadow: 0 30px 80px rgba(0,0,0,.5);
        }

        .logo {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            color: #e5c46b;
            font-size: 42px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }

        label {
            display: block;
            color: #ddd;
            font-size: 12px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;

            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.2);
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #d4af37;
        }

        button {
            width: 100%;
            padding: 15px;

            background: #d4af37;
            border: none;
            color: #071525;

            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
        }

        button:hover {
            background: #f0d477;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            color: #e5c46b;
            font-size: 13px;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #aaa;
            text-decoration: none;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">GrandVista</div>

    <div class="subtitle">
        HOTEL MANAGEMENT SYSTEM
    </div>

    <form id="loginForm">

        <label>USERNAME</label>
        <input type="text" id="username" required>

        <label>PASSWORD</label>
        <input type="password" id="password" required>

        <button type="submit">
            SIGN IN
        </button>

    </form>

    <div id="message"></div>

    <div class="back">
        <a href="index.html">← Back to Home</a>
    </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const response = await fetch("/api/admin/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            username: username,
            password: password
        })

    });

    const data = await response.json();

    if(data.success) {

        localStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        window.location.href =
            "dashboard.html";

    } else {

        document.getElementById("message")
            .textContent =
            data.message;

    }

});

</script>

</body>
</html>
