<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GrandVista | Customers</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #071525;
    color: white;
    font-family: Montserrat, sans-serif;
}

.sidebar {
    position: fixed;
    width: 240px;
    height: 100vh;
    background: #06172b;
    border-right: 1px solid #34445a;
    padding: 35px 20px;
}

.logo {
    text-align: center;
    font-family: 'Cormorant Garamond';
    color: #e5c46b;
    font-size: 36px;
    margin-bottom: 40px;
}

.menu a {
    display: block;
    padding: 14px;
    color: #cbd2da;
    text-decoration: none;
    font-size: 12px;
    margin-bottom: 6px;
}

.menu a:hover,
.menu .active {
    color: #e5c46b;
    background: rgba(212,175,55,.12);
}

.main {
    margin-left: 240px;
    padding: 40px;
}

h1 {
    font-family: 'Cormorant Garamond';
    font-size: 48px;
    color: #e5c46b;
}

.subtitle {
    color: #9da8b5;
    font-size: 12px;
    margin-bottom: 30px;
}

.form {
    background: #0b2038;
    padding: 25px;
    border: 1px solid rgba(212,175,55,.25);
    margin-bottom: 30px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 15px;
}

input {
    padding: 13px;
    background: #071525;
    color: white;
    border: 1px solid #33465c;
}

button {
    padding: 13px;
    background: #d4af37;
    color: #071525;
    border: none;
    cursor: pointer;
    font-weight: 600;
}

.table-box {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #0b2038;
}

th {
    color: #d4af37;
    padding: 15px;
    text-align: left;
    font-size: 11px;
}

td {
    padding: 15px;
    border-top: 1px solid #24384e;
    font-size: 12px;
    color: #d0d5db;
}

.delete {
    background: #642f2f;
    color: white;
}

@media(max-width:800px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">GrandVista</div>

<div class="menu">

<a href="dashboard.html">Dashboard</a>
<a href="rooms.html">Rooms</a>
<a class="active" href="customers.html">Customers</a>
<a href="booking.html">Bookings</a>
<a href="checkin-checkout.html">Check-In / Check-Out</a>
<a href="billing.html">Billing</a>

</div>

</div>


<div class="main">

<h1>Guests & Customers</h1>

<div class="subtitle">
Manage your GrandVista guests
</div>


<div class="form">

<div class="form-grid">

<input id="name" placeholder="Full Name">

<input id="email" placeholder="Email">

<input id="phone" placeholder="Phone">

<input id="address" placeholder="Address">

<button onclick="addCustomer()">
ADD CUSTOMER
</button>

</div>

</div>


<div class="table-box">

<table>

<thead>

<tr>

<th>ID</th>
<th>NAME</th>
<th>EMAIL</th>
<th>PHONE</th>
<th>ADDRESS</th>
<th>ACTION</th>

</tr>

</thead>

<tbody id="customerTable"></tbody>

</table>

</div>

</div>


<script>

if(localStorage.getItem("adminLoggedIn") !== "true") {

    window.location.href =
        "admin-login.html";

}


async function loadCustomers() {

    const response =
        await fetch("/api/customers");

    const customers =
        await response.json();

    const table =
        document.getElementById(
            "customerTable"
        );

    table.innerHTML = "";

    customers.forEach(customer => {

        table.innerHTML += `

            <tr>

                <td>${customer.id}</td>

                <td>${customer.name}</td>

                <td>${customer.email}</td>

                <td>${customer.phone}</td>

                <td>${customer.address || ""}</td>

                <td>

                    <button
                        class="delete"
                        onclick="deleteCustomer(${customer.id})"
                    >
                        DELETE
                    </button>

                </td>

            </tr>

        `;

    });

}


async function addCustomer() {

    const customer = {

        name:
            document.getElementById("name").value,

        email:
            document.getElementById("email").value,

        phone:
            document.getElementById("phone").value,

        address:
            document.getElementById("address").value

    };


    const response =
        await fetch("/api/customers", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(customer)

        });


    const data =
        await response.json();


    if(response.ok) {

        alert(
            "Customer added successfully"
        );

        document
            .querySelectorAll("input")
            .forEach(input =>
                input.value = ""
            );

        loadCustomers();

    } else {

        alert(data.error);

    }

}


async function deleteCustomer(id) {

    if(!confirm(
        "Delete this customer?"
    )) return;


    await fetch(
        "/api/customers/" + id,
        {
            method: "DELETE"
        }
    );

    loadCustomers();

}


loadCustomers();

</script>

</body>
</html>
