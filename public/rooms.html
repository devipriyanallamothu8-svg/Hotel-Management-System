<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GrandVista | Rooms</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Montserrat, sans-serif;
    background: #071525;
    color: white;
}

.sidebar {
    position: fixed;
    width: 240px;
    height: 100vh;
    background: #06172b;
    border-right: 1px solid #35445a;
    padding: 35px 20px;
}

.logo {
    font-family: 'Cormorant Garamond';
    font-size: 36px;
    text-align: center;
    color: #e5c46b;
    margin-bottom: 40px;
}

.menu a {
    display: block;
    padding: 14px;
    margin-bottom: 6px;
    color: #cbd2da;
    text-decoration: none;
    font-size: 12px;
}

.menu a:hover,
.menu .active {
    color: #e5c46b;
    background: rgba(212,175,55,.12);
}

.main {
    margin-left: 240px;
    padding: 40px;
}

.header {
    margin-bottom: 30px;
}

.header h1 {
    font-family: 'Cormorant Garamond';
    font-size: 48px;
    color: #e5c46b;
}

.header p {
    color: #9da8b5;
    font-size: 12px;
}

.room-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 25px;
}

.room {
    background: #0b2038;
    border: 1px solid rgba(212,175,55,.25);
    overflow: hidden;
    transition: .3s;
}

.room:hover {
    transform: translateY(-7px);
    border-color: #d4af37;
}

.room-image {
    width: 100%;
    height: 210px;
    object-fit: cover;
}

.room-content {
    padding: 22px;
}

.room-number {
    color: #e5c46b;
    font-size: 12px;
    letter-spacing: 2px;
}

.room h2 {
    font-family: 'Cormorant Garamond';
    font-size: 30px;
    margin: 7px 0;
}

.price {
    color: #ddd;
    margin: 10px 0;
}

.status {
    display: inline-block;
    padding: 7px 12px;
    font-size: 10px;
    margin-bottom: 15px;
}

.available {
    background: #173c32;
    color: #7ce0ae;
}

.booked {
    background: #492525;
    color: #ff9999;
}

button {
    width: 100%;
    padding: 12px;
    border: 1px solid #d4af37;
    background: transparent;
    color: #e5c46b;
    cursor: pointer;
}

button:hover {
    background: #d4af37;
    color: #071525;
}

.logout {
    margin-top: 25px;
    background: transparent;
}

@media(max-width:1000px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
    }

    .room-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media(max-width:600px) {

    .room-grid {
        grid-template-columns: 1fr;
    }

    .main {
        padding: 20px;
    }
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">GrandVista</div>

<div class="menu">

<a href="dashboard.html">Dashboard</a>
<a class="active" href="rooms.html">Rooms</a>
<a href="customers.html">Customers</a>
<a href="booking.html">Bookings</a>
<a href="checkin-checkout.html">Check-In / Check-Out</a>
<a href="billing.html">Billing</a>

</div>

<button class="logout" onclick="logout()">LOGOUT</button>

</div>


<div class="main">

<div class="header">

<h1>Our Rooms</h1>

<p>
Discover comfort, elegance and unforgettable stays.
</p>

</div>

<div class="room-grid" id="rooms"></div>

</div>


<script>

if(localStorage.getItem("adminLoggedIn") !== "true") {

    window.location.href =
        "admin-login.html";

}


const images = [

"https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=900&q=85",

"https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=900&q=85",

"https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=900&q=85",

"https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=900&q=85"

];


async function loadRooms() {

    const response =
        await fetch("/api/rooms");

    const rooms =
        await response.json();

    const container =
        document.getElementById("rooms");

    container.innerHTML = "";

    rooms.forEach((room,index) => {

        const image =
            images[index % images.length];

        const available =
            room.status === "Available";

        container.innerHTML += `

            <div class="room">

                <img
                    class="room-image"
                    src="${image}"
                    alt="Hotel Room"
                >

                <div class="room-content">

                    <div class="room-number">
                        ROOM ${room.room_number}
                    </div>

                    <h2>
                        ${room.room_type}
                    </h2>

                    <div class="price">
                        ₹${room.price} / night
                    </div>

                    <div class="status ${
                        available
                        ? "available"
                        : "booked"
                    }">

                        ${room.status}

                    </div>

                    ${
                        available
                        ?
                        `<button onclick="bookRoom()">
                            BOOK THIS ROOM
                        </button>`
                        :
                        ""
                    }

                </div>

            </div>

        `;

    });

}


function bookRoom() {

    window.location.href =
        "booking.html";

}


function logout() {

    localStorage.removeItem(
        "adminLoggedIn"
    );

    window.location.href =
        "admin-login.html";

}


loadRooms();

</script>

</body>
</html>
