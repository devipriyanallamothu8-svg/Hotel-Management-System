<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GrandVista | Billing</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #071525;
    color: white;
    font-family: Montserrat, sans-serif;
}

.sidebar {
    position: fixed;
    width: 240px;
    height: 100vh;
    background: #06172b;
    border-right: 1px solid #34445a;
    padding: 35px 20px;
}

.logo {
    text-align: center;
    font-family: 'Cormorant Garamond';
    color: #e5c46b;
    font-size: 36px;
    margin-bottom: 40px;
}

.menu a {
    display: block;
    padding: 14px;
    color: #cbd2da;
    text-decoration: none;
    font-size: 12px;
    margin-bottom: 6px;
}

.menu a:hover,
.menu .active {
    color: #e5c46b;
    background: rgba(212,175,55,.12);
}

.main {
    margin-left: 240px;
    padding: 40px;
}

h1 {
    font-family: 'Cormorant Garamond';
    font-size: 48px;
    color: #e5c46b;
}

.subtitle {
    color: #9da8b5;
    font-size: 12px;
    margin-bottom: 30px;
}

.table-box {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #0b2038;
}

th {
    padding: 15px;
    color: #d4af37;
    font-size: 10px;
    text-align: left;
}

td {
    padding: 15px;
    border-top: 1px solid #263a50;
    font-size: 11px;
}

.pay {
    padding: 9px 14px;
    background: #d4af37;
    color: #071525;
    border: none;
    cursor: pointer;
}

.paid {
    color: #7ce0ae;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    justify-content: center;
    align-items: center;
}

.modal-box {
    width: 400px;
    background: #0b2038;
    padding: 30px;
    border: 1px solid #d4af37;
}

.modal-box h2 {
    font-family: 'Cormorant Garamond';
    color: #e5c46b;
    font-size: 35px;
    margin-bottom: 20px;
}

.modal-box input,
.modal-box select {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    background: #071525;
    border: 1px solid #33465c;
    color: white;
}

.modal-box button {
    width: 100%;
    padding: 13px;
    background: #d4af37;
    border: none;
    cursor: pointer;
}

.close {
    background: transparent !important;
    color: #aaa;
    margin-top: 8px;
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">GrandVista</div>

<div class="menu">

<a href="dashboard.html">Dashboard</a>
<a href="rooms.html">Rooms</a>
<a href="customers.html">Customers</a>
<a href="booking.html">Bookings</a>
<a href="checkin-checkout.html">Check-In / Check-Out</a>
<a class="active" href="billing.html">Billing</a>

</div>

</div>


<div class="main">

<h1>Guest Billing</h1>

<div class="subtitle">
Payments and hotel invoices
</div>


<div class="table-box">

<table>

<thead>

<tr>

<th>GUEST</th>
<th>ROOM</th>
<th>CHECK-IN</th>
<th>CHECK-OUT</th>
<th>TOTAL</th>
<th>STATUS</th>
<th>ACTION</th>

</tr>

</thead>

<tbody id="billingTable"></tbody>

</table>

</div>

</div>


<div class="modal" id="paymentModal">

<div class="modal-box">

<h2>Make Payment</h2>

<input
id="bookingId"
readonly
>

<input
id="amount"
type="number"
placeholder="Amount"
>

<select id="paymentMethod">

<option value="Cash">
Cash
</option>

<option value="UPI">
UPI
</option>

<option value="Card">
Card
</option>

</select>

<button onclick="makePayment()">
CONFIRM PAYMENT
</button>

<button
class="close"
onclick="closeModal()"
>
CANCEL
</button>

</div>

</div>


<script>

if(localStorage.getItem("adminLoggedIn") !== "true") {

    window.location.href =
        "admin-login.html";

}


let currentBookingId = null;


async function loadBilling() {

    const response =
        await fetch("/api/billing");

    const bills =
        await response.json();

    const table =
        document.getElementById(
            "billingTable"
        );

    table.innerHTML = "";


    bills.forEach(bill => {

        const paid =
            bill.paid_amount != null &&
            Number(bill.paid_amount) >=
            Number(bill.total_amount);


        table.innerHTML += `

            <tr>

                <td>
                    ${bill.customer_name}
                </td>

                <td>
                    ${bill.room_number}
                </td>

                <td>
                    ${bill.check_in}
                </td>

                <td>
                    ${bill.check_out}
                </td>

                <td>
                    ₹${bill.total_amount}
                </td>

                <td>

                    ${
                        paid
                        ?
                        `<span class="paid">
                            PAID
                        </span>`
                        :
                        `PENDING`
                    }

                </td>

                <td>

                    ${
                        paid
                        ?
                        `<span class="paid">
                            ✓ Paid
                        </span>`
                        :
                        `<button
                            class="pay"
                            onclick="openPayment(
                                ${bill.booking_id},
                                ${bill.total_amount}
                            )"
                        >
                            PAY NOW
                        </button>`
                    }

                </td>

            </tr>

        `;

    });

}


function openPayment(
    bookingId,
    amount
) {

    currentBookingId =
        bookingId;

    document.getElementById(
        "bookingId"
    ).value =
        "Booking #" +
        bookingId;

    document.getElementById(
        "amount"
    ).value =
        amount;

    document.getElementById(
        "paymentModal"
    ).style.display =
        "flex";

}


function closeModal() {

    document.getElementById(
        "paymentModal"
    ).style.display =
        "none";

}


async function makePayment() {

    const amount =
        document.getElementById(
            "amount"
        ).value;

    const paymentMethod =
        document.getElementById(
            "paymentMethod"
        ).value;


    const response =
        await fetch(
            "/api/billing/payment",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    booking_id:
                        currentBookingId,

                    amount:
                        amount,

                    payment_method:
                        paymentMethod

                })

            }
        );


    const data =
        await response.json();


    if(response.ok) {

        alert(
            "Payment recorded successfully"
        );

        closeModal();

        loadBilling();

    } else {

        alert(data.error);

    }

}


loadBilling();

</script>

</body>
</html>
