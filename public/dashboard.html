<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GrandVista | Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: #071525;
    color: white;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 250px;
    height: 100vh;

    background:
        linear-gradient(rgba(5,20,38,.94), rgba(5,20,38,.97)),
        url("https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80")
        center/cover;

    border-right: 1px solid rgba(212,175,55,.25);
    padding: 35px 20px;
}

.logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    color: #e5c46b;
    text-align: center;
    margin-bottom: 5px;
}

.brand {
    text-align: center;
    font-size: 9px;
    letter-spacing: 3px;
    color: #aaa;
    margin-bottom: 45px;
}

.menu a {
    display: block;
    padding: 15px 18px;
    margin-bottom: 7px;

    color: #c9d0d8;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: .5px;

    transition: .3s;
}

.menu a:hover,
.menu .active {
    background: rgba(212,175,55,.12);
    color: #e5c46b;
    border-left: 3px solid #d4af37;
}

.logout {
    position: absolute;
    bottom: 30px;
    left: 20px;
    right: 20px;

    background: transparent;
    border: 1px solid #8b6f1d;
    color: #e5c46b;

    padding: 12px;
    cursor: pointer;
}

.main {
    margin-left: 250px;
    padding: 35px;
}

.hero {
    min-height: 270px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    padding: 50px;

    background:
        linear-gradient(90deg, rgba(5,20,38,.94), rgba(5,20,38,.45)),
        url("https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1800&q=85")
        center/cover;

    border: 1px solid rgba(212,175,55,.25);
}

.hero-small {
    color: #e5c46b;
    letter-spacing: 4px;
    font-size: 11px;
    margin-bottom: 15px;
}

.hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 55px;
    margin-bottom: 12px;
}

.quote {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 25px;
    color: #eadba8;
}

.date {
    margin-top: 20px;
    color: #aeb8c4;
    font-size: 12px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 18px;
    margin-top: 25px;
}

.card {
    padding: 25px;
    background: #0b2038;
    border: 1px solid rgba(212,175,55,.2);
}

.card-title {
    color: #aab3bd;
    font-size: 11px;
    letter-spacing: 1px;
}

.card-value {
    color: #e5c46b;
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    margin-top: 8px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 25px;
}

.panel {
    background: #0b2038;
    border: 1px solid rgba(212,175,55,.2);
    padding: 25px;
}

.panel h2 {
    font-family: 'Cormorant Garamond', serif;
    color: #e5c46b;
    margin-bottom: 20px;
}

canvas {
    max-height: 250px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    color: #d4af37;
    font-size: 10px;
    text-align: left;
    padding: 12px;
    border-bottom: 1px solid #26394e;
}

td {
    color: #c9d0d8;
    font-size: 11px;
    padding: 13px 12px;
    border-bottom: 1px solid #1b3046;
}

@media(max-width:1000px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .logout {
        position: relative;
        left: 0;
        bottom: 0;
        margin-top: 20px;
    }

    .main {
        margin-left: 0;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .grid {
        grid-template-columns: 1fr;
    }
}

@media(max-width:600px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .main {
        padding: 15px;
    }

    .hero {
        padding: 30px;
    }

    .hero h1 {
        font-size: 40px;
    }
}

</style>
</head>

<body>

<div class="sidebar">

    <div class="logo">GrandVista</div>

    <div class="brand">
        HOTEL MANAGEMENT
    </div>

    <div class="menu">

        <a class="active" href="dashboard.html">
            Dashboard
        </a>

        <a href="rooms.html">
            Rooms
        </a>

        <a href="customers.html">
            Customers
        </a>

        <a href="booking.html">
            Bookings
        </a>

        <a href="checkin-checkout.html">
            Check-In / Check-Out
        </a>

        <a href="billing.html">
            Billing
        </a>

    </div>

    <button class="logout" onclick="logout()">
        LOGOUT
    </button>

</div>

<div class="main">

    <section class="hero">

        <div class="hero-small">
            WELCOME BACK
        </div>

        <h1>
            GrandVista Hotels
        </h1>

        <div class="quote">
            “Luxury is not a place. It is the feeling you take with you.”
        </div>

        <div class="date" id="date"></div>

    </section>


    <section class="stats">

        <div class="card">
            <div class="card-title">TOTAL ROOMS</div>
            <div class="card-value" id="totalRooms">0</div>
        </div>

        <div class="card">
            <div class="card-title">AVAILABLE ROOMS</div>
            <div class="card-value" id="availableRooms">0</div>
        </div>

        <div class="card">
            <div class="card-title">CUSTOMERS</div>
            <div class="card-value" id="totalCustomers">0</div>
        </div>

        <div class="card">
            <div class="card-title">REVENUE</div>
            <div class="card-value" id="totalRevenue">₹0</div>
        </div>

    </section>


    <section class="grid">

        <div class="panel">

            <h2>
                Booking Overview
            </h2>

            <canvas id="bookingChart"></canvas>

        </div>


        <div class="panel">

            <h2>
                Recent Bookings
            </h2>

            <table>

                <thead>

                    <tr>
                        <th>GUEST</th>
                        <th>ROOM</th>
                        <th>STATUS</th>
                    </tr>

                </thead>

                <tbody id="bookingTable"></tbody>

            </table>

        </div>

    </section>

</div>


<script>

if(localStorage.getItem("adminLoggedIn") !== "true") {

    window.location.href =
        "admin-login.html";

}


document.getElementById("date").textContent =
    new Date().toLocaleDateString(
        "en-IN",
        {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }
    );


let chart;


async function loadDashboard() {

    try {

        const statsResponse =
            await fetch("/api/dashboard/stats");

        const stats =
            await statsResponse.json();


        document.getElementById("totalRooms")
            .textContent =
            stats.totalRooms;

        document.getElementById("availableRooms")
            .textContent =
            stats.availableRooms;

        document.getElementById("totalCustomers")
            .textContent =
            stats.totalCustomers;

        document.getElementById("totalRevenue")
            .textContent =
            "₹" +
            Number(stats.totalRevenue)
            .toLocaleString("en-IN");


        if(chart) {
            chart.destroy();
        }


        chart =
            new Chart(
                document.getElementById("bookingChart"),
                {

                    type: "doughnut",

                    data: {

                        labels: [
                            "Available Rooms",
                            "Booked Rooms"
                        ],

                        datasets: [{

                            data: [
                                stats.availableRooms,
                                stats.bookedRooms
                            ]

                        }]

                    },

                    options: {

                        responsive: true,

                        plugins: {

                            legend: {
                                labels: {
                                    color: "#ddd"
                                }
                            }

                        }

                    }

                }
            );


        const bookingsResponse =
            await fetch("/api/bookings");

        const bookings =
            await bookingsResponse.json();


        const table =
            document.getElementById(
                "bookingTable"
            );

        table.innerHTML = "";


        bookings
            .slice(0,5)
            .forEach(booking => {

                table.innerHTML += `

                    <tr>

                        <td>
                            ${booking.customer_name}
                        </td>

                        <td>
                            ${booking.room_number}
                        </td>

                        <td>
                            ${booking.status}
                        </td>

                    </tr>

                `;

            });

    }

    catch(error) {

        console.error(error);

    }

}


function logout() {

    localStorage.removeItem(
        "adminLoggedIn"
    );

    window.location.href =
        "admin-login.html";

}


loadDashboard();

setInterval(
    loadDashboard,
    15000
);

</script>

</body>
</html>
